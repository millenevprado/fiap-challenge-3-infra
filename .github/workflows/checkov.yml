name: IaC Security

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  checkov:
    name: IaC Security (Checkov)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkov Scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          output_format: cli
          soft_fail: true
